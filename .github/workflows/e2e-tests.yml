name: BillPulse Playwright E2E Test Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Execute Playwright E2E UI Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout UI test suite into ./pw-e2e-ts
      - name: Checkout UI Test Repository
        uses: actions/checkout@v4
        with:
          path: pw-e2e-ts

      # 2. Checkout private core-lib into ./core-lib
      - name: Checkout Private Core Library (@script-crux)
        uses: actions/checkout@v4
        with:
          repository: 'APdrone/automation-core-lib'
          token: ${{ secrets.GH_PAT }}
          path: core-lib

      # 3. Checkout private BillPulse target application into ./app-billpulse
      - name: Checkout Private Target Application (BillPulse)
        uses: actions/checkout@v4
        with:
          repository: 'APdrone/billpulse-fintech-app'
          token: ${{ secrets.GH_PAT }}
          path: app-billpulse

      # 4. Setup Node.js runtime & pnpm package manager
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 5. Build Core Library Packages
      - name: Build Core Library Packages
        run: |
          cd core-lib
          pnpm install --ignore-scripts
          pnpm run build

      # 6. Start BillPulse Backend Cluster & Frontend Client
      - name: Start BillPulse Microservices Cluster & UI Client
        run: |
          cd app-billpulse
          npm ci
          npm run dev:server &
          cd client
          npm ci
          npm run dev &
          npx wait-on http://localhost:4000/api/testing/health http://localhost:3000 --timeout 60000

      # 7. Install Playwright Browsers & Dependencies
      - name: Install Playwright Browsers
        run: |
          cd pw-e2e-ts
          npm ci
          npx playwright install --with-deps chromium

      # 8. Run Playwright E2E Tests
      - name: Run Playwright E2E Tests
        run: |
          cd pw-e2e-ts
          npm test -- --project=chromium

      # 9. Upload HTML Test Report Artifact on Failure/Completion
      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pw-e2e-ts/playwright-report/
          retention-days: 14
